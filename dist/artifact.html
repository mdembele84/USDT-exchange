<title>Change USDT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&display=swap">
<style>
/* Layout : coque Ikadou — barre latérale sombre fixe groupée par sections, barre haute blanche, surface de travail pâle avec cartes et tableaux bordés */
:root{
  --sb-w:248px;
  --sb-bg:#0c1c27;--sb-head:#071820;--sb-line:#1d2e36;--sb-text:#bfd0d8;--sb-strong:#ffffff;--sb-label:#86979f;--sb-hover:#14293a;--sb-active:#1899a9;--sb-mark:#d95924;--sb-badge:#f25f1f;--sb-logo:#f2f7f6;--sb-logo-ink:#1899a9;--sb-avatar:#113640;--sb-avatar-ink:#5fb7c4;
  --bg:#f6f8fa;--surface:#ffffff;--surface-2:#f9fbfc;--surface-3:#eff3f5;--line:#dee5e5;--line-2:#ebeff0;
  --ink:#161a20;--ink-2:#5c6669;--ink-3:#858f94;--ink-4:#aab2b5;
  --teal:#1899a9;--teal-ink:#175a65;--teal-soft:#def4f8;--teal-soft-2:#c6ebf1;
  --green:#2aa36a;--green-hover:#23905d;--green-ink:#1b7346;--green-soft:#e2f5eb;
  --amber:#e0a100;--amber-ink:#875800;--amber-soft:#fdf1d6;
  --red:#d03b3b;--red-ink:#b3261e;--red-soft:#fce9e7;
  --orange-ink:#bf4f15;
  --blue-ink:#195a7d;--blue-soft:#dff2fc;
  --pill:#edf1f4;--pill-ink:#5a636a;
  --on-accent:#ffffff;
  --c-nous:#1899a9;--c-doudou:#eb6834;--c-congo:#6250d6;--c-mali:#d69200;--c-local:#e87ba4;
  --grid:#e9eef0;--axis:#c5ced2;--hl:rgba(24,153,169,.08);
  --scrim:rgba(7,24,32,.42);
  --shadow:0 1px 2px rgba(12,28,39,.05);--shadow-pop:0 1px 2px rgba(12,28,39,.14);--shadow-lg:0 18px 40px rgba(12,28,39,.18);
  --font:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:8px;--r-lg:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sb-bg:#08151d;--sb-head:#050f15;--sb-line:#172832;--sb-text:#bfd0d8;--sb-strong:#ffffff;--sb-label:#7d8f97;--sb-hover:#0f2430;--sb-active:#1899a9;--sb-mark:#e0682f;--sb-badge:#f25f1f;--sb-logo:#e8f1f0;--sb-logo-ink:#13808e;--sb-avatar:#123a45;--sb-avatar-ink:#7fcbd6;
  --bg:#0b161d;--surface:#101e27;--surface-2:#13232e;--surface-3:#182b37;--line:#223641;--line-2:#1a2c37;
  --ink:#e3ebee;--ink-2:#a6b5bb;--ink-3:#7f9199;--ink-4:#5b6e77;
  --teal:#22aabb;--teal-ink:#8fd9e4;--teal-soft:#123540;--teal-soft-2:#18464f;
  --green:#23935e;--green-hover:#2aa36a;--green-ink:#6dd29e;--green-soft:#0f2d21;
  --amber:#e0a100;--amber-ink:#f0c25e;--amber-soft:#2d2411;
  --red:#e05a5a;--red-ink:#f39b93;--red-soft:#351a1a;
  --orange-ink:#f3925c;
  --blue-ink:#8ccbec;--blue-soft:#10293a;
  --pill:#1a2d39;--pill-ink:#a7b6bd;
  --on-accent:#ffffff;
  --c-nous:#1899a9;--c-doudou:#d95926;--c-congo:#9085e9;--c-mali:#c98500;--c-local:#d55181;
  --grid:#1a2c37;--axis:#2c414c;--hl:rgba(34,170,187,.10);
  --scrim:rgba(0,0,0,.6);
  --shadow:none;--shadow-pop:0 1px 2px rgba(0,0,0,.5);--shadow-lg:0 18px 40px rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --sb-bg:#08151d;--sb-head:#050f15;--sb-line:#172832;--sb-text:#bfd0d8;--sb-strong:#ffffff;--sb-label:#7d8f97;--sb-hover:#0f2430;--sb-active:#1899a9;--sb-mark:#e0682f;--sb-badge:#f25f1f;--sb-logo:#e8f1f0;--sb-logo-ink:#13808e;--sb-avatar:#123a45;--sb-avatar-ink:#7fcbd6;
  --bg:#0b161d;--surface:#101e27;--surface-2:#13232e;--surface-3:#182b37;--line:#223641;--line-2:#1a2c37;
  --ink:#e3ebee;--ink-2:#a6b5bb;--ink-3:#7f9199;--ink-4:#5b6e77;
  --teal:#22aabb;--teal-ink:#8fd9e4;--teal-soft:#123540;--teal-soft-2:#18464f;
  --green:#23935e;--green-hover:#2aa36a;--green-ink:#6dd29e;--green-soft:#0f2d21;
  --amber:#e0a100;--amber-ink:#f0c25e;--amber-soft:#2d2411;
  --red:#e05a5a;--red-ink:#f39b93;--red-soft:#351a1a;
  --orange-ink:#f3925c;
  --blue-ink:#8ccbec;--blue-soft:#10293a;
  --pill:#1a2d39;--pill-ink:#a7b6bd;
  --on-accent:#ffffff;
  --c-nous:#1899a9;--c-doudou:#d95926;--c-congo:#9085e9;--c-mali:#c98500;--c-local:#d55181;
  --grid:#1a2c37;--axis:#2c414c;--hl:rgba(34,170,187,.10);
  --scrim:rgba(0,0,0,.6);
  --shadow:none;--shadow-pop:0 1px 2px rgba(0,0,0,.5);--shadow-lg:0 18px 40px rgba(0,0,0,.55);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--font);font-optical-sizing:auto}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{text-wrap:balance}
.ic{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- barre latérale ---------- */
.sidebar{position:fixed;top:0;bottom:0;left:0;width:calc(var(--sb-w) + env(safe-area-inset-left,0px));padding-left:env(safe-area-inset-left,0px);background:var(--sb-bg);color:var(--sb-text);display:flex;flex-direction:column;z-index:50;border-right:1px solid var(--sb-line);transition:width .18s ease,transform .2s ease}
.sb-head{flex:none;height:calc(64px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;gap:11px;background:var(--sb-head);border-bottom:1px solid var(--sb-line)}
.sb-logo{width:34px;height:34px;border-radius:7px;background:var(--sb-logo);color:var(--sb-logo-ink);display:grid;place-items:center;flex:none}
.sb-word{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.sb-word b{color:var(--sb-strong);font-size:15.5px;font-weight:600;letter-spacing:.01em}
.sb-word small{color:var(--sb-label);font-size:11px;font-weight:500;letter-spacing:.06em;white-space:nowrap}
.sb-nav{flex:1;overflow-y:auto;padding:10px 10px 14px;scrollbar-width:thin}
.sb-sec{font-size:11px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:var(--sb-label);padding:18px 12px 7px;white-space:nowrap}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;min-height:42px;padding:8px 12px;margin:2px 0;border-radius:7px;color:var(--sb-text);text-decoration:none;font-size:15px;font-weight:500}
.nav-item:hover{background:var(--sb-hover);color:var(--sb-strong)}
.nav-item.active{background:var(--sb-active);color:var(--sb-strong)}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--sb-mark)}
.nav-item .ic{width:19px;height:19px}
.nav-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--sb-badge);color:var(--on-accent);font-size:12px;font-weight:700;display:grid;place-items:center}
.nav-dot{width:7px;height:7px;border-radius:2px;flex:none}
.sb-foot{flex:none;border-top:1px solid var(--sb-line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;min-height:72px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sb-avatar);color:var(--sb-avatar-ink);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.sb-user{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.sb-user b{color:var(--sb-strong);font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user small{color:var(--sb-label);font-size:12.5px}
.sb-scrim{display:none}
body.sb-collapsed{--sb-w:76px}
body.sb-collapsed .sb-word,body.sb-collapsed .nav-item .lbl,body.sb-collapsed .nav-dot,body.sb-collapsed .sb-user{display:none}
body.sb-collapsed .sb-sec{font-size:0;padding:10px 12px 4px}
body.sb-collapsed .sb-sec::after{content:"";display:block;height:1px;background:var(--sb-line)}
body.sb-collapsed .nav-item{justify-content:center;padding:8px}
body.sb-collapsed .nav-badge{position:absolute;top:2px;right:4px;min-width:18px;height:18px;font-size:11px}
body.sb-collapsed .sb-head{justify-content:center;padding-inline:0}
body.sb-collapsed .sb-foot{justify-content:center;padding-inline:0}

/* ---------- zone principale ---------- */
.main{margin-left:calc(var(--sb-w) + env(safe-area-inset-left,0px));min-width:0;display:flex;flex-direction:column;min-height:100%;transition:margin-left .18s ease}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-left:22px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.tb-title{margin:0;font-size:16.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:12px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-4)}
.sync.live i{background:var(--green)}
.sync.demo i{background:var(--amber)}
.sync.ro i{background:var(--teal)}
.content{width:100%;max-width:1480px;padding-block:30px 56px;padding-left:30px;padding-right:max(30px,env(safe-area-inset-right,0px))}
.content:focus{outline:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{margin:0;font-size:27px;font-weight:600;letter-spacing:-.012em;line-height:1.2}
.page-head p{margin:7px 0 0;color:var(--ink-2);font-size:15px;max-width:76ch}
.page-head .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- briques ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding:16px 18px 0}
.card-head h3{margin:0;font-size:15.5px;font-weight:600}
.card-head .sub{color:var(--ink-3);font-size:13px}
.card-body{padding:14px 18px 18px}
.card-foot{padding:12px 18px;border-top:1px solid var(--line-2);color:var(--ink-3);font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid{display:grid;gap:16px;margin-top:16px;align-items:start}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:7px;border:1px solid transparent;font-size:14.5px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;background:var(--surface);color:var(--ink);transition:background .15s,border-color .15s,color .15s}
.btn .ic{width:16px;height:16px}
.btn-primary{background:var(--green);color:var(--on-accent)}
.btn-primary:hover{background:var(--green-hover)}
.btn-soft{background:var(--teal-soft);color:var(--teal-ink)}
.btn-soft:hover{background:var(--teal-soft-2)}
.btn-line{border-color:var(--line)}
.btn-line:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn-danger{background:var(--red);color:var(--on-accent)}
.btn-danger-ghost{background:transparent;color:var(--red-ink)}
.btn-danger-ghost:hover{background:var(--red-soft)}
.btn-sm{height:32px;padding:0 11px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:7px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--pill);color:var(--pill-ink)}
.pill .ic{width:13px;height:13px}
.pill-blue{background:var(--blue-soft);color:var(--blue-ink)}
.pill-green{background:var(--green-soft);color:var(--green-ink)}
.pill-amber{background:var(--amber-soft);color:var(--amber-ink)}
.pill-red{background:var(--red-soft);color:var(--red-ink)}
.pill-teal{background:var(--teal-soft);color:var(--teal-ink)}
.fbadge{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px 0 9px;border-radius:6px;background:var(--pill);color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap}
.fbadge i{width:8px;height:8px;border-radius:2px;flex:none}
.ref{font-size:12.5px;color:var(--ink-3);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.todo{color:var(--orange-ink)}
.none{color:var(--ink-4);font-style:italic}
.pos{color:var(--green-ink)}
.neg{color:var(--red-ink)}
.callout{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:var(--r-lg);background:var(--blue-soft);color:var(--blue-ink);font-size:14px;margin-bottom:16px}
.callout .ic{margin-top:1px}
.callout .grow{flex:1;min-width:0}
.claim-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.callout.amber{background:var(--amber-soft);color:var(--amber-ink)}
.callout b{font-weight:600}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:38px 20px;color:var(--ink-2)}
.empty .em-ic{width:46px;height:46px;border-radius:12px;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center}
.empty h4{margin:0;font-size:16px;color:var(--ink);font-weight:600}
.empty p{margin:0;max-width:52ch}
.empty .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:9px;background:var(--surface-3);flex-wrap:wrap}
.seg button{height:32px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-weight:500;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-pop)}

/* ---------- indicateurs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:17px 18px 16px;display:flex;flex-direction:column;gap:6px}
.kpi-label{font-size:13.5px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:8px}
.kpi-label .ic{width:16px;height:16px;color:var(--ink-3)}
.kpi-value{font-size:28px;font-weight:600;letter-spacing:-.015em;line-height:1.15;overflow-wrap:anywhere}
.kpi-value small{font-size:14.5px;font-weight:500;color:var(--ink-2);margin-left:5px;letter-spacing:0}
.kpi-sub{font-size:13px;color:var(--ink-3);display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:600}
.delta .ic{width:15px;height:15px}
.delta.up{color:var(--green-ink)}
.delta.down{color:var(--red-ink)}

/* ---------- tableaux ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px}
.search{position:relative;flex:1 1 260px;max-width:390px}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3)}
.search input{width:100%;height:46px;padding:0 12px 0 40px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:15px}
.search input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.toolbar .spacer{flex:1}
.tbl-wrap{overflow-x:auto;position:relative}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px}
.tbl th{background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;text-align:left;padding:14px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.sortable{text-transform:none;letter-spacing:.02em;font-size:14px;color:var(--ink-2)}
.tbl th.sortable button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.tbl th.sortable button:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:3px}
.tbl th.sortable .ic{width:14px;height:14px;color:var(--ink-4)}
.tbl th.sortable.on .ic{color:var(--teal)}
.tbl th:first-child{border-top-left-radius:var(--r-lg)}
.tbl th:last-child{border-top-right-radius:var(--r-lg)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td.num{white-space:nowrap}
.tbl td small,.cell-sub{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.tbl .c-client{min-width:150px}
.tbl .c-client b{font-weight:500;white-space:nowrap}
.link{all:unset;cursor:pointer;font-weight:500;color:var(--ink);white-space:nowrap;border-radius:3px}
.link:hover{color:var(--teal-ink);text-decoration:underline;text-underline-offset:3px}
.link:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.tbl tr[data-row]{cursor:pointer}
.tbl .c-client small,.ref{white-space:nowrap}
.tbl .c-next{min-width:140px;max-width:240px}
.tbl .c-act{text-align:right;white-space:nowrap}
.tbl .c-act .btn+.btn{margin-left:8px}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0;background:var(--surface-2)}
.tbl.compact td,.tbl.compact th{padding:10px 10px}
.op-list{display:none}
.op-card{padding:14px 16px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:9px}
.op-card:last-child{border-bottom:0}
.oc-top,.oc-mid,.oc-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oc-mid{justify-content:space-between;align-items:flex-start;flex-wrap:nowrap}
.oc-mid .r{text-align:right;white-space:nowrap}
.oc-act{justify-content:flex-end}
.oc-top{flex-wrap:nowrap}
.oc-top .ref{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}

/* ---------- formulaires ---------- */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px}
.field label,.field .lab{font-size:13.5px;font-weight:500;color:var(--ink-2)}
.inp{display:flex;align-items:center;height:42px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 12px;gap:8px}
.inp:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.inp input,.inp select{flex:1;min-width:0;border:0;outline:0;background:transparent;height:100%;font-size:15px;font-variant-numeric:tabular-nums}
.inp select{cursor:pointer}
.inp .unit{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.inp.is-auto{background:var(--surface-2)}
.inp[aria-disabled="true"]{opacity:.6}
textarea.ta{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:10px 12px;font-size:14.5px}
textarea.ta:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.field .help{font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
.auto-on{color:var(--teal-ink);font-weight:500}
.field.err .inp{border-color:var(--red)}
.field .errmsg{font-size:12.5px;color:var(--red-ink)}
.auto-tag{font-size:11.5px;color:var(--teal-ink);background:var(--teal-soft);border-radius:5px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.auto-reset{font-size:12px;border:0;background:none;color:var(--teal-ink);cursor:pointer;padding:2px 4px;display:inline-flex;gap:4px;align-items:center;border-radius:4px;white-space:nowrap}
.auto-reset .ic{width:13px;height:13px}
.auto-reset:hover{background:var(--teal-soft)}
.types{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.type-btn{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:12px 13px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.type-btn:hover{border-color:var(--teal-soft-2)}
.type-btn[aria-checked="true"]{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal)}
.type-btn .tb-dot{width:10px;height:10px;border-radius:3px;margin-top:5px;flex:none}
.type-btn b{display:block;font-weight:600;font-size:14.5px}
.type-btn small{display:block;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.type-btn .tb-txt{min-width:0}
.drawer .types{grid-template-columns:repeat(2,minmax(0,1fr))}
.drawer .types .type-btn:last-child:nth-child(odd){grid-column:1/-1}

/* ---------- résultats ---------- */
.hero-res{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;padding:18px}
.hero-res .lbl{font-size:13.5px;color:var(--ink-2);font-weight:500}
.hero-res .big{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.hero-res .big small{font-size:17px;font-weight:500;color:var(--ink-2);margin-left:6px;letter-spacing:0}
.hero-res .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.res-mini{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:14px 16px;border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--line-2)}
.res-mini .big{font-size:24px;font-weight:600;letter-spacing:-.01em}
.res-mini .lbl{font-size:12.5px;color:var(--ink-3);font-weight:500}
.legs{list-style:none;margin:0;padding:0;counter-reset:leg}
.leg{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr) auto;column-gap:12px;row-gap:1px;padding:9px 0}
.leg::before{counter-increment:leg;content:counter(leg);grid-row:1/3;width:24px;height:24px;border-radius:50%;background:var(--teal-soft);color:var(--teal-ink);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.leg:not(:last-child)::after{content:"";position:absolute;left:11.5px;top:36px;bottom:-8px;width:1px;background:var(--line)}
.leg .l-place{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.leg .l-label{font-weight:500;grid-column:2}
.leg .l-amt{grid-column:3;grid-row:1/3;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;align-self:center}
.leg .l-amt small{display:block;font-size:12px;color:var(--ink-3);font-weight:400}
.pl{display:flex;flex-direction:column}
.pl-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.pl-row:last-child{border-bottom:0}
.pl-row .v{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.pl-row .note{display:block;font-size:12px;color:var(--ink-3);font-weight:400}
.pl-row.total{font-weight:600}
.pl-row.final{background:var(--teal-soft);color:var(--teal-ink);border-radius:8px;padding:11px 12px;border:0;margin-top:8px;font-weight:600}
.pl-row.final .note{color:var(--teal-ink);opacity:.8}
.pl-row.final.loss{background:var(--red-soft);color:var(--red-ink)}
.pl-row.final.loss .note{color:var(--red-ink)}
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.flow .node{display:inline-flex;flex-direction:column;padding:7px 11px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2);line-height:1.2}
.flow .node b{font-size:13.5px;font-weight:600}
.flow .node small{font-size:11.5px;color:var(--ink-3)}
.flow .ic{width:16px;height:16px;color:var(--ink-4)}
.meter{display:flex;flex-direction:column;gap:7px;min-width:220px;flex:1;max-width:380px}
.meter-top{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);gap:10px}
.meter-track{position:relative;height:8px;border-radius:4px;background:var(--surface-3)}
.meter-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.meter-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);border-radius:1px}
.meter-cap{font-size:12px;color:var(--ink-3)}
.sens td.on{background:var(--teal-soft)}
.sens tr.thr td{background:var(--surface-2)}
.kv{display:grid;grid-template-columns:minmax(38%,1fr) minmax(0,auto);gap:0}
.kv>div{display:contents}
.kv dt,.kv dd{padding:9px 0;border-bottom:1px solid var(--line-2);margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{text-align:right;font-weight:500;font-variant-numeric:tabular-nums;padding-left:14px}
.kv dd small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.kv>div:last-child dt,.kv>div:last-child dd{border-bottom:0}
.rows{display:flex;flex-direction:column}
.row-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.row-item:last-child{border-bottom:0}
.row-item .grow{flex:1;min-width:0}
.row-item .grow b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .grow small{display:block;font-size:12.5px;color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:2px;flex:none}

/* ---------- graphique ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:2px}
.chart{position:relative;margin-top:12px;min-height:250px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid-l{stroke:var(--grid);stroke-width:1}
.chart .axis-l{stroke:var(--axis);stroke-width:1}
.chart .tick{fill:var(--ink-3);font-size:11.5px;font-family:var(--font)}
.chart .lab{fill:var(--ink-2);font-size:11.5px;font-weight:600;font-family:var(--font)}
.chart .band{fill:transparent;cursor:default}
.chart .band:focus{outline:none}
.chart .hlr{fill:var(--hl);opacity:0}
.chart .hlr.on{opacity:1}
.chart-empty{position:absolute;inset:0 0 26px 46px;display:grid;place-items:center;text-align:center;color:var(--ink-3);font-size:14px;padding:20px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-lg);padding:10px 12px;font-size:12.5px;min-width:190px;z-index:5}
.tip .t-head{font-weight:600;margin-bottom:6px;color:var(--ink)}
.tip .t-row{display:flex;align-items:center;gap:8px;padding:2px 0}
.tip .t-row span{flex:1;color:var(--ink-2)}
.tip .t-row b{font-variant-numeric:tabular-nums;color:var(--ink)}
.tip .t-row.tot{border-top:1px solid var(--line-2);margin-top:4px;padding-top:6px}
.tip .key{width:12px;height:3px;border-radius:2px;flex:none}

/* ---------- étapes ---------- */
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:7px;cursor:pointer}
.step:hover{background:var(--surface-2)}
.step input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid var(--axis);border-radius:6px;display:grid;place-items:center;margin:0;flex:none;cursor:pointer;background:var(--surface)}
.step input:checked{background:var(--green);border-color:var(--green)}
.step input:checked::after{content:"";width:9px;height:5px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.step input:disabled{cursor:not-allowed}
.step .txt{flex:1;min-width:0}
.step.done .txt{color:var(--ink-2)}
.step .when{font-size:12px;color:var(--ink-3);white-space:nowrap}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--surface-3)}
.progress i.on{background:var(--green)}

/* ---------- partenaires ---------- */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column}
.pc-head{display:flex;align-items:center;gap:12px;padding:16px 18px 4px}
.pc-av{width:42px;height:42px;border-radius:50%;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center;font-weight:600;font-size:15px;flex:none}
.pc-head h3{margin:0;font-size:16px;font-weight:600}
.pc-head small{display:block;color:var(--ink-3);font-size:13px}
.pcard .card-body{flex:1}
.pc-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line-2)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;width:100%}
.confirm p{margin:0;flex:1 1 200px;font-size:13.5px;color:var(--ink-2)}

/* ---------- panneau latéral ---------- */
.drawer-wrap{position:fixed;inset:0;z-index:70}
.drawer-bg{position:absolute;inset:0;background:var(--scrim)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.anim{animation:slidein .2s ease}
.dr-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 16px;border-bottom:1px solid var(--line)}
.dr-head .grow{flex:1;min-width:0}
.dr-kicker{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dr-head h2{margin:8px 0 2px;font-size:20px;font-weight:600;overflow-wrap:anywhere}
.dr-sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--ink-2);font-size:13.5px}
.dr-body{flex:1;overflow-y:auto;padding:18px 20px 26px;display:flex;flex-direction:column;gap:22px}
.dr-sec h4{margin:0 0 8px;font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.dr-foot{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.dr-foot .spacer{flex:1}
@keyframes slidein{from{transform:translateX(28px);opacity:.5}to{transform:none;opacity:1}}

/* ---------- notification ---------- */
.toast{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;width:min(430px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:14px 10px 14px 16px;display:flex;gap:12px;align-items:center}
body.dr-open .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.toast .t-ic{color:var(--green);display:grid}
.toast .t-ic.error{color:var(--red)}
.toast .t-msg{flex:1;font-size:14px}

/* ---------- réglages ---------- */
.set-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(170px,1fr) minmax(0,1fr);gap:8px 16px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2)}
.set-row:last-child{border-bottom:0}
.set-row .lab b{display:block;font-weight:500}
.set-row .lab small{display:block;color:var(--ink-3);font-size:12.5px}
.set-row .meta{font-size:12.5px;color:var(--ink-3);text-align:right}
.corr-row{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:8px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.corr-row .inp:last-child{grid-column:1/-1}
.corr-row:last-child{border-bottom:0}
.part-row{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);gap:10px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.part-row:last-child{border-bottom:0}
.save-row{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:14px}
.save-row .note{flex:1;color:var(--ink-3);font-size:12.5px}

.form-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.who{display:flex;align-items:center;gap:10px;white-space:nowrap}
.who b{font-weight:500}
.mini-av{width:32px;height:32px;border-radius:50%;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none}
.mail{white-space:nowrap}
.sim{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:1151px){.sim .form{grid-template-columns:minmax(0,1fr)}}

  .g-2{grid-template-columns:minmax(0,1fr)}
}

@media (max-width:760px){

}

      }

    this.user = user; this.dl = dl;

    }

async function exportSbi() {
  if (!Store.dl) return;
  const P = periodInfo(S.sbiPeriod), list = S.ops.filter(isSbi).map(enrich).filter(e => e.r && inRange(e.op, P.from, P.to)).sort((a, b) => (a.op.date < b.op.date ? -1 : 1));
  const cell = x => { const s = String(x ?? ''); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [['Date', 'Référence', 'Flux', 'Client', 'Montant XAF', 'Référence virement', 'Rapproché']].concat(list.map(e => [e.op.date, e.op.ref, FLUX[e.op.type].short, e.op.client, Math.round(e.r.receipt.amount), e.op.inputs.bankRef || '', e.op.reconciled ? 'oui' : 'non']));
  try {
    await Store.dl.save({ filename: `fonds-sbi-${todayISO()}.csv`, data: '﻿' + lines.map(r => r.map(cell).join(';')).join('\r\n') });
    toast('Relevé exporté.');
  } catch (e) { if (!e || e.code !== 'declined') toast("L'export n'a pas pu être enregistré sur cet appareil.", 'error'); }
}

async function saveMember() {
  const E = S.memberEdit; if (!E || E.busy) return;
  E.name = $('#um-name').value.trim(); E.email = $('#um-email').value.trim().toLowerCase(); E.role = $('#um-role').value === 'admin' ? 'admin' : 'operateur';
  const errs = {}, cur = E.id ? S.members.find(m => m.id === E.id) : null;
  if (!E.name) errs.name = 'Indiquez un nom.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(E.email)) errs.email = 'Adresse e-mail invalide.';
  else if (S.members.some(m => m.id !== E.id && (m.email || '').toLowerCase() === E.email)) errs.email = 'Cette adresse a déjà une fiche.';
  if (cur && cur.role === 'admin' && E.role !== 'admin' && !S.members.some(m => m.id !== E.id && m.role === 'admin')) errs.role = 'Gardez au moins un administrateur.';
  E.errs = errs;
  if (Object.keys(errs).length) { renderView(); const el = $('.field.err input, .field.err select'); if (el) el.focus(); return; }
  const now = new Date().toISOString();
  const body = { name: E.name, email: E.email, role: E.role, uids: cur && cur.uids ? cur.uids.slice() : [], createdAt: (cur && cur.createdAt) || now, createdBy: cur ? (cur.createdBy ?? null) : (S.me.id || null), updatedAt: now };

  catch (e) { E.busy = false; writeFailed(e); }
}

document.addEventListener('click', async e => {

    case 'dup': { const op = findOp(id); if (!op) break; const manual = {}; Object.keys(op.inputs || {}).forEach(k => { manual[k] = true; }); S.drawer = { mode: 'create', d: { ...newDraft(op.type, clone(op.inputs || {}), manual), client: op.client || '' } }; renderDrawer(true); break; }

    }
    case 'status': S.status = a.dataset.status; $$('[data-act="status"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.status === S.status))); renderOpsArea(); break;
    case 'sort': { const k = a.dataset.key; S.sort = S.sort.key === k ? { key: k, dir: S.sort.dir === 'asc' ? 'desc' : 'asc' } : { key: k, dir: k === 'client' || k === 'status' ? 'asc' : 'desc' }; renderOpsArea(); break; }
    case 'chart-table': S.chartTable = !S.chartTable; renderView(); break;
    case 'pay': S.confirm = { kind: 'pay', id }; renderView(); break;
    case 'pay-confirm': {
      const now = new Date().toISOString();
      const targets = S.ops.map(enrich).filter(e => e.r && e.r.commission && e.r.commission.partner === id && !e.op.steps?.comm);
      S.confirm = null;
      try { for (const e of targets) await Store.patchOp(e.op.id, { steps: { comm: true }, stepsAt: { comm: now }, stepsBy: { comm: myRef() || S.me.id || null }, ...stamp() }); toast(`${plural(targets.length, 'commission marquée', 'commissions marquées')} comme versée${targets.length > 1 ? 's' : ''} à ${pname(id)}.`); }
      catch (err) { writeFailed(err); }
      renderView(); break;
    }
    case 'reconcile': { const op = findOp(id); if (!op) break; try { await Store.patchOp(id, { reconciled: !op.reconciled, reconciledAt: !op.reconciled ? new Date().toISOString() : null, ...stamp() }); } catch (err) { writeFailed(err); } break; }
    case 'export-sbi': await exportSbi(); break;
    case 'save-set': await saveSettings(a.dataset.form); break;
    case 'claim-later': S.skipClaim = true; renderView(); break;
    case 'user-new': S.memberEdit = { id: null, name: '', email: '', role: 'operateur', errs: {} }; S.confirm = null; renderView(); $('#um-name')?.focus(); break;
    case 'user-edit': { const m = S.members.find(x => x.id === id); if (!m) break; S.memberEdit = { id, name: m.name, email: m.email, role: m.role, errs: {} }; S.confirm = null; renderView(); $('#um-name')?.focus(); break; }
    case 'user-cancel': S.memberEdit = null; renderView(); break;
    case 'user-save': await saveMember(); break;
    case 'user-del': S.confirm = { kind: 'user-del', id }; renderView(); break;
    case 'user-del-confirm': { const m = S.members.find(x => x.id === id); S.confirm = null; try { await Store.deleteMember(id); toast(`Fiche de ${m ? m.name : "l'utilisateur"} retirée. Retirez aussi son accès dans le menu Partager si besoin.`); } catch (err) { writeFailed(err); } renderView(); break; }
    case 'user-claim': { const m = S.members.find(x => x.id === id); if (!m || !S.me.id) break; try { await Store.patchMember(id, { uids: [...(m.uids || []).filter(u => u !== S.me.id), S.me.id], updatedAt: new Date().toISOString() }); toast(`Votre compte est relié à la fiche de ${m.name}.`); } catch (err) { writeFailed(err); } renderView(); break; }
    case 'toast-close': $('#toast').hidden = true; break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; renderOpsArea(); return; }
  const form = t.dataset && t.dataset.form; if (!form) return;
  if (form.startsWith('set-')) { S.dirty[form] = true; return; }
  const d = draftOf(form); if (!d) return;
  const key = t.dataset.key;
  if (key === 'date' || key === 'client' || key === 'note') { d[key] = t.value; if (key === 'date' && d.errs) delete d.errs.date; return; }
  if (t.tagName === 'SELECT') return;
  d.vals[key] = t.value;
  const f = fieldDefs(d.type, d.vals).find(x => x.key === key);
  const fe = t.closest('.field');
  if (f && f.auto && !d.manual[key]) { d.manual[key] = true; t.closest('.inp').classList.remove('is-auto'); }
  if (f && (f.auto || (d.errs && d.errs[key]))) {
    if (d.errs) delete d.errs[key];
    fe.classList.remove('err');
    const old = fe.querySelector('.help, .errmsg'), html = helpHTML(form, f, d, resolve(d.type, d), null);
    if (old) old.outerHTML = html; else if (html) fe.insertAdjacentHTML('beforeend', html);
  }
  refreshAutos(form);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.actChange === 'step') { toggleStep(t.dataset.id, t.dataset.k, t.checked); return; }
  const form = t.dataset && t.dataset.form; if (!form || form.startsWith('set-')) { if (form) S.dirty[form] = true; return; }
  const dd = draftOf(form), fd = dd && t.dataset.key ? fieldDefs(dd.type, dd.vals).find(f => f.key === t.dataset.key) : null;
  if (fd && fd.restructure) {
    if (t.dataset.key === 'currency') { dd.vals.currency = normCur(t.value); ['rateProvider', 'rateClient'].forEach(k => { delete dd.manual[k]; delete dd.vals[k]; }); }
    rerenderFields(form); return;
  }
  if (t.tagName !== 'SELECT') { if ((t.dataset.key) && fieldDefs(draftOf(form)?.type || 'nous', draftOf(form)?.vals).find(f => f.key === t.dataset.key && (f.type || 'num') === 'num')) { const d = draftOf(form), f = fieldDefs(d.type, d.vals).find(x => x.key === t.dataset.key), n = parseNum(t.value); if (isFinite(n)) t.value = fmtInput(n, f.max); } return; }
  const d = draftOf(form); if (!d) return;
  d.vals[t.dataset.key] = t.value; d.manual[t.dataset.key] = true;
  rerenderFields(form);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('um-')) { e.preventDefault(); saveMember(); return; }
  if (e.key === 'Escape') {
    if (S.drawer) { S.drawer = null; S.confirm = null; renderDrawer(); }
    else if (S.memberEdit) { S.memberEdit = null; renderView(); }
    else if (document.body.classList.contains('sb-open')) document.body.classList.remove('sb-open');
  }
});
window.addEventListener('hashchange', () => setView(decodeURIComponent(location.hash.slice(1))));
let rsT, lastW = window.innerWidth; window.addEventListener('resize', () => { if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(rsT); rsT = setTimeout(() => { if (S.view === 'tableau-de-bord' && !S.chartTable) drawChart(); }, 120); });

/* ===================== démarrage ===================== */
if (LS.get('sbCollapsed', false)) document.body.classList.add('sb-collapsed');
S.view = VIEWS[decodeURIComponent(location.hash.slice(1))] ? decodeURIComponent(location.hash.slice(1)) : 'tableau-de-bord';
renderChrome(); renderView();
Store.init();
</script>
